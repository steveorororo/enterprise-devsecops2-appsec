# Representative application repository caller. Mirrors how a consuming repository invokes the
# platform, held here so a change to the reusable workflow interface fails in this repository
# rather than in the application repositories that depend on it.
#
# Not executed by this repository. scripts/validate-consumer-contract.py checks it against
# platform/contract.yaml, including that job ids match the security gate contract and that the
# pinned commit, platform_ref and platform_version all refer to the same release.
name: PR Security

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  secrets-scan:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/secret-scanning.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  iac-checkov:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/iac-security.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
      security-events: write
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  manifest-lint:
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/manifest-security.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0

  gate:
    needs: [secrets-scan, iac-checkov, manifest-lint]
    if: always()
    uses: steveorororo/enterprise-devsecops2-appsec/.github/workflows/security-gate.yml@351ea5b9ff24f51e4f9f51404447200007244df0
    permissions:
      contents: read
    with:
      platform_ref: 351ea5b9ff24f51e4f9f51404447200007244df0
      needs: ${{ toJSON(needs) }}
