# Reusable workflow compatibility contract, treated as an enterprise API.
#
# Machine readable so a consumer fixture can be checked against it and drift is detected
# before it reaches application repositories. docs/compatibility-contract.md states the
# change rules; this file states the interface.
#
# Removing or renaming an element, changing its meaning, increasing required privileges,
# increasing secret exposure or changing gate semantics is a breaking change and requires
# compatibility analysis and regression evidence. Additive optional inputs are compatible.
#
# The implementation of these workflows is not extracted yet. The contract is declared first
# so extraction is measured against a stated interface rather than defining it after the fact.

workflows:
  - path: .github/workflows/pr-security.yml
    status: planned
    purpose: Pull request security validation and the central security gate.
    inputs:
      required:
        - name: application_path
          type: string
          purpose: Application source directory within the calling repository.
      optional:
        - name: platform_version
          type: string
          purpose: Human readable release identifier accompanying the pinned workflow SHA.
    # Only secrets the workflow genuinely requires. secrets: inherit is not a supported
    # calling convention, because it grants the callee every credential the caller holds.
    secrets:
      required: []
      optional: []
    permissions:
      workflow: {}
      job:
        contents: read
        security-events: write
    outputs:
      - name: gate_result
        purpose: Aggregate result of the mandatory controls.
    # The status check name application repository rulesets require. Renaming it silently
    # removes branch protection for every consumer, so it is part of the contract.
    status_check: gate

caller:
  # A caller must pin an immutable commit. Mutable references such as @main are rejected.
  reference: immutable_sha
  forbidden_references:
    - "@main"
    - "@master"
    - "@v1"
  forbidden_secret_conventions:
    - inherit
