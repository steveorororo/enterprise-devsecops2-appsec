# Committed credential detection for consuming repositories.
#
# Scans full history rather than the diff, so a credential introduced earlier and still
# present is reported rather than treated as pre-existing and therefore acceptable.
name: Secret Scanning

on:
  workflow_call:
    inputs:
      platform_ref:
        description: >-
          Commit of this repository to load central configuration from. Must equal the commit
          the caller pinned in its uses reference.
        required: true
        type: string

permissions: {}

jobs:
  secret-scanning:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --exit-code 1
