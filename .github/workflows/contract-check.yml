# Contract validation for consuming repositories. Callable, and deliberately not a security
# capability: it confirms a caller is wired to this platform correctly. No scanner runs here.
#
# Self contained by design. A reusable workflow checks out the calling repository, not the
# repository that hosts it, so reaching this repository's own files would need a credential
# with access to it. The platform's release and contract gates therefore run in this
# repository's own pipeline, and this workflow verifies the consumption boundary instead.
name: Contract Check

on:
  workflow_call:
    inputs:
      application_path:
        description: Application source directory in the calling repository.
        required: true
        type: string
      platform_version:
        description: Human readable release identifier accompanying the pinned commit.
        required: false
        type: string
    outputs:
      contract_result:
        description: Result of the consumption boundary checks.
        value: ${{ jobs.contract.outputs.result }}

# No secrets are declared or accepted. A caller cannot pass credentials to this workflow,
# and this workflow cannot reach any credential the caller holds.
permissions: {}

jobs:
  contract:
    runs-on: ubuntu-24.04
    # Nothing is checked out and no API call is made, so no permission is required.
    permissions: {}
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      - name: Verify the consumption boundary
        id: verify
        run: |
          set -euo pipefail
          echo "caller repository: ${CALLER_REPO}"
          echo "caller ref:        ${CALLER_REF}"
          echo "platform reference: ${PLATFORM_REF}"
          echo "application_path:  ${APPLICATION_PATH}"
          echo "platform_version:  ${PLATFORM_VERSION:-unset}"

          if [ -z "${APPLICATION_PATH}" ]; then
            echo "::error::application_path is required by the platform contract." >&2
            exit 1
          fi

          # job_workflow_ref carries the reference the caller actually pinned, in the form
          # owner/repo/.github/workflows/file.yml@<ref>. Immutable consumption is the
          # contract, so a caller on a branch or tag is rejected rather than reported.
          pinned="${PLATFORM_REF##*@}"
          echo "pinned reference:  ${pinned}"
          case "${pinned}" in
            refs/heads/*|refs/tags/*|main|master)
              echo "::error::platform is consumed at mutable reference ${pinned}." >&2
              exit 1
              ;;
          esac
          if [ "${#pinned}" -ne 40 ] || [ -n "$(printf '%s' "${pinned}" | tr -d '0-9a-f')" ]; then
            echo "::error::platform reference ${pinned} is not a full 40 character commit." >&2
            exit 1
          fi

          echo "result=passed" >> "$GITHUB_OUTPUT"
          echo "consumption boundary verified"
        env:
          CALLER_REPO: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          PLATFORM_REF: ${{ github.job_workflow_ref }}
          APPLICATION_PATH: ${{ inputs.application_path }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
