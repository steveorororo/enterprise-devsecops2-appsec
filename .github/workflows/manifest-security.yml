# Kubernetes manifest security for consuming repositories.
#
# Overlays are rendered before they are linted, and the render failure is part of the
# control. kube-linter exits zero and reports no valid objects found on input it cannot
# parse, so linting sources directly would pass an unparseable manifest. Rendering first
# fails closed. tests/regression/test-render-invariant.py enforces this.
name: Manifest Security

on:
  workflow_call:
    inputs:
      platform_ref:
        description: >-
          Commit of this repository to load central configuration from. Must equal the commit
          the caller pinned in its uses reference, which the consumer contract gate enforces.
        required: true
        type: string
      overlays:
        description: Space separated overlay directories under deploy/overlays.
        required: false
        default: dev test prod
        type: string

permissions: {}

jobs:
  manifest-security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Central configuration is read at the pinned platform commit, so a consumer's
      # scanner policy cannot change without a reviewed pointer update.
      - name: Check out platform configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: steveorororo/enterprise-devsecops2-appsec
          ref: ${{ inputs.platform_ref }}
          path: .platform
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install kube-linter
        env:
          KUBE_LINTER_VERSION: 0.8.3
          # SHA-256 of kubelinter-cosign.pub at the pinned tag. Pinning the published
          # verification material means a rewritten tag or a substituted file fails here
          # rather than silently becoming the trust root for the binary. Changing the
          # version requires re-pinning this digest.
          KUBE_LINTER_PUB_SHA256: db5fb95bf3e1d432a3e9153abcc75ca4985aad1e44f414b8ebc624a2fac97ba0
        run: |
          set -euo pipefail
          base="https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}"
          curl -sSfL -o kube-linter-linux "${base}/kube-linter-linux"
          curl -sSfL -o kube-linter-linux.sigstore.json "${base}/kube-linter-linux.sigstore.json"
          # kube-linter disables checksum publication and signs its binaries with a project
          # key rather than a Fulcio identity, so the release is verified against that key.
          curl -sSfL -o kubelinter-cosign.pub \
            "https://raw.githubusercontent.com/stackrox/kube-linter/v${KUBE_LINTER_VERSION}/kubelinter-cosign.pub"
          echo "${KUBE_LINTER_PUB_SHA256}  kubelinter-cosign.pub" | sha256sum -c -
          cosign verify-blob \
            --key kubelinter-cosign.pub \
            --bundle kube-linter-linux.sigstore.json \
            kube-linter-linux
          chmod +x kube-linter-linux
          sudo mv kube-linter-linux /usr/local/bin/kube-linter

      - name: Render and lint
        env:
          KUSTOMIZE_VERSION: 5.4.3
          OVERLAYS: ${{ inputs.overlays }}
        run: |
          set -euo pipefail
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" kustomize
          sudo mv kustomize /usr/local/bin/
          for overlay in ${OVERLAYS}; do
            kustomize build "deploy/overlays/${overlay}" \
              | kube-linter lint --config .platform/security/kube-linter.yaml -
          done
